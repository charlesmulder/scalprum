name: Setup Environment
description: Setup Node.js, npm, and dependencies for scalprum project
inputs:
  registry-url:
    description: 'npm registry URL for publishing (optional)'
    required: false
runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        registry-url: ${{ inputs.registry-url }}
    - uses: nrwl/nx-set-shas@v4
    - uses: './.github/actions/node-cache'
    - name: Install deps
      shell: bash
      run: npm ci
